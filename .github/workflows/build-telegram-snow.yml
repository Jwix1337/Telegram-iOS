name: Build Telegram Snow for SideStore

on:
  push:
    branches: [master]
    paths:
      - 'submodules/**'
      - 'build-system/**'
      - '.github/workflows/build-telegram-snow.yml'
      - 'versions.json'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.gitmodules'
  workflow_dispatch:
    inputs:
      models_only:
        description: Run isolated Winter model tests without compiling Telegram or producing IPA
        type: boolean
        default: false
      api_mode:
        description: Auto uses own secrets when present; otherwise official upstream sample FOR TESTING ONLY
        type: choice
        options: [auto, own]
        default: auto
      bundle_id:
        description: Separate identifier; keep it unchanged for future updates
        type: string
        default: org.snoweffect.TelegramSnow
      include_extensions:
        description: Keep Share/Widget/Siri/notification/broadcast extensions (additional App IDs)
        type: boolean
        default: false
      runner:
        description: Verified macOS 27 image; larger runner requires GitHub billing
        type: choice
        options: [xcode-27, xcode-27-xlarge]
        default: xcode-27

permissions:
  contents: read

concurrency:
  group: telegram-snow-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  winter-models:
    if: ${{ inputs.models_only }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Typecheck the complete SnowEffect module against the iOS SDK
        run: python3 build-system/SnowEffect/typecheck_snow_effect.py
      - run: python3 build-system/SnowEffect/test_winter_models.py
      - run: swiftc -frontend -parse submodules/SnowEffect/Sources/*.swift submodules/TelegramUI/Sources/WinterChatInteractions.swift
  device:
    if: ${{ !inputs.models_only }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SNOW_BUNDLE_ID: ${{ inputs.bundle_id || 'org.snoweffect.TelegramSnow' }}
      SNOW_INCLUDE_EXTENSIONS: ${{ inputs.include_extensions || false }}
      SNOW_API_MODE: ${{ inputs.api_mode || 'auto' }}
    steps:
      - name: Check API credential mode before downloading sources
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ -n "$TELEGRAM_API_ID" && -z "$TELEGRAM_API_HASH" || -z "$TELEGRAM_API_ID" && -n "$TELEGRAM_API_HASH" ]]; then
            echo '::error::Supply both TELEGRAM_API_ID and TELEGRAM_API_HASH, not just one secret.'
            exit 1
          fi
          if [[ "$SNOW_API_MODE" == own && -z "$TELEGRAM_API_ID" ]]; then
            echo '::error::Own API mode requires TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets.'
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check artifact validation rules
        shell: bash
        run: python3 -m unittest discover -s build-system/SnowEffect/tests -q

      # Cache downloaded dependencies and the checksum-verified Bazel executable,
      # never private configuration, credentials, provisioning or compiled apps.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: |
            ~/.cache/telegram-snow-repositories
            build-input/bazel-9.2.0-darwin-arm64
          key: telegram-snow-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock', '.gitmodules') }}

      - name: Configure the pinned toolchain and Telegram
        id: configure
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          sudo xcode-select --switch "$DEVELOPER_DIR"
          python3 build-system/SnowEffect/sidestore_build.py configure
          df -h .

      - name: Typecheck SnowEffect before the full application build
        run: python3 build-system/SnowEffect/typecheck_snow_effect.py

      - name: Compile the real iPhone application
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py --bazel="$SNOW_BAZEL" build \
            --configurationPath="$RUNNER_TEMP/telegram-snow-configuration.json" \
            --xcodeManagedCodesigning --configuration=release_arm64 \
            --buildNumber="$((100000 + GITHUB_RUN_NUMBER))"

      - name: Validate and package for SideStore re-signing
        shell: bash
        run: |
          python3 build-system/SnowEffect/sidestore_build.py package \
            --input=bazel-bin/Telegram/Telegram.ipa \
            --output="build/artifacts/$SNOW_IPA_NAME" \
            --bundle-id="$SNOW_BUNDLE_ID"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TelegramSnow-iPhone-SideStore-${{ env.SNOW_CREDENTIAL_SOURCE }}-${{ github.run_number }}
          path: build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary API configuration
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/telegram-snow-configuration.json"

      - name: Save verified downloads even after a compile failure
        if: ${{ always() && steps.configure.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/telegram-snow-repositories
            build-input/bazel-9.2.0-darwin-arm64
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
